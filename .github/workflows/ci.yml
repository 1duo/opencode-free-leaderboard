name: Release checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.9'
          python-version: '3.11'
      - name: Install locked dependencies
        run: uv sync --frozen --no-editable
      - name: Static checks
        run: |
          uv run --frozen --no-editable ruff check src tests grading/worker.py
          node --check web/app.js
      - name: Production and privacy regressions (no provider calls)
        run: uv run --frozen --no-editable pytest -q tests/test_production.py tests/test_privacy.py
      - name: Evaluation safety regressions (no provider calls)
        run: >-
          uv run --frozen --no-editable pytest -q tests/test_core.py
          -k 'fail_closed or generation_endpoint or reservation_reconciliation or ambiguous_request
          or saved_response_recovery or explicit_retries or missing_cap_usage or complete_panels_and_paired
          or merged_capabilities or confirmation_reuses or public_export_omits or failed_export_preserves
          or container_isolation or highest_reasoning or cap_revoked'
      - name: Validate public artifact and renderer consistency
        run: |
          uv run --frozen --no-editable python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader, select_autoescape
          from freeboard.publication import validate_site
          report = validate_site(Path('site'))
          environment = Environment(loader=FileSystemLoader('web'), autoescape=select_autoescape(['html']))
          assert Path('site/index.html').read_text() == environment.get_template('index.html').render(report=report)
          for name in ['app.js', 'style.css']:
              assert (Path('web')/name).read_bytes() == (Path('site')/name).read_bytes()
          PY
