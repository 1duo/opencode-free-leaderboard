name: Publish leaderboard
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate publication files and stamp artifact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          root = Path('site')
          assert {p.name for p in root.iterdir()} == {'index.html','app.js','style.css','snapshot.json','manifest.json','leaderboard.csv','.nojekyll'}
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          path = root/'snapshot.json'
          data = json.loads(path.read_text())
          data['published_at'] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data, indent=2))
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy complete snapshot
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
