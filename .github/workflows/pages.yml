name: Publish leaderboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.9'
          python-version: '3.11'
      - name: Build public snapshot plus accepted community submissions
        run: |
          uv sync --frozen --no-editable --no-dev
          uv run --frozen --no-editable --no-dev leaderboard --repository "$GITHUB_REPOSITORY" build-site --output "$RUNNER_TEMP/public-site"
      - name: Validate publication files and stamp artifact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          import os
          root = Path(os.environ['RUNNER_TEMP'])/'public-site'
          assert {p.name for p in root.iterdir()} == {'index.html','app.js','style.css','snapshot.json','manifest.json','leaderboard.csv','.nojekyll'}
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          path = root/'snapshot.json'
          data = json.loads(path.read_text())
          data['published_at'] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data, indent=2))
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-site
      - name: Deploy complete snapshot
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
